<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavyStream - Private Music Player</title>
    <!-- Tailwind CSS Styling Engine -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome Vector Icon Library -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0b1329; color: #ffffff; font-family: sans-serif; }
        .dynamic-scroll::-webkit-scrollbar { width: 4px; }
        .dynamic-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .dynamic-scroll::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- MAIN CORE APPLICATION DASHBOARD (Instant Access - No Password Required) -->
    <div id="main-app" class="w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- SIDE PANEL: EQUALIZER MODULES -->
        <div class="bg-slate-950 border border-slate-800/60 p-5 rounded-xl flex flex-col gap-6">
            <div>
                <h3 class="text-lg font-bold text-slate-200 mb-4"><i class="fa-solid fa-sliders text-indigo-400 mr-2"></i>Customization & EQ</h3>
                <div class="flex items-center justify-between text-sm text-slate-400 bg-slate-900/60 p-3 rounded-lg border border-slate-800/40">
                    <span>Match Wallpaper to Album Art</span>
                    <input type="checkbox" checked class="accent-indigo-500 w-4 h-4">
                </div>
            </div>

            <!-- EQ SLIDERS SYSTEM -->
            <div class="flex flex-col gap-4">
                <div>
                    <div class="flex justify-between text-xs text-slate-400 mb-1"><span>Bass</span><span id="bass-val">0 dB</span></div>
                    <input type="range" min="-10" max="10" value="0" oninput="document.getElementById('bass-val').innerText = this.value + ' dB'" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg appearance-none">
                </div>
                <div>
                    <div class="flex justify-between text-xs text-slate-400 mb-1"><span>Mid</span><span id="mid-val">0 dB</span></div>
                    <input type="range" min="-10" max="10" value="0" oninput="document.getElementById('mid-val').innerText = this.value + ' dB'" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg appearance-none">
                </div>
                <div>
                    <div class="flex justify-between text-xs text-slate-400 mb-1"><span>Treble</span><span id="treble-val">0 dB</span></div>
                    <input type="range" min="-10" max="10" value="0" oninput="document.getElementById('treble-val').innerText = this.value + ' dB'" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg appearance-none">
                </div>
            </div>
            <p class="text-[10px] text-slate-500 italic leading-relaxed border-t border-slate-800/80 pt-3">
                Note: True DSP Filtering is limited for external streams due to CORS security. Sliders operate in design visual preview mode.
            </p>
        </div>

        <!-- MAIN MEDIA PLAYER SECTION -->
        <div class="md:col-span-2 flex flex-col justify-between gap-6">
            <div class="bg-gradient-to-b from-slate-800/40 to-slate-950 p-6 rounded-xl border border-slate-800/50 flex flex-col items-center text-center relative overflow-hidden group">
                <div id="album-art" class="w-44 h-44 bg-slate-800 rounded-xl shadow-xl flex items-center justify-center text-slate-600 text-6xl mb-4 border border-slate-700/50 transition-all duration-500 group-hover:scale-105">
                    <i class="fa-solid fa-music text-indigo-500"></i>
                </div>
                <h2 id="player-title" class="text-xl font-bold tracking-wide text-slate-100 mb-1">Select a Track</h2>
                <p id="player-album" class="text-sm text-indigo-400 font-medium mb-4">Private Audio Mix Vault</p>

                <!-- Audio Track Timeline Progress Slider Layout -->
                <div class="w-full flex items-center gap-3 text-xs text-slate-400 mb-4">
                    <span id="curr-time">0:00</span>
                    <input type="range" id="progress-bar" min="0" max="100" value="0" oninput="seekAudio()" class="w-full accent-indigo-500 bg-slate-800 h-1 rounded-lg appearance-none cursor-pointer">
                    <span id="total-time">0:00</span>
                </div>

                <!-- Media Track Action Controls -->
                <div class="flex items-center gap-6 text-xl">
                    <button onclick="prevTrack()" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="togglePlay()" id="play-btn" class="w-14 h-14 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center shadow-lg transition-all transform active:scale-95 text-2xl">
                        <i class="fa-solid fa-play ml-1"></i>
                    </button>
                    <button onclick="nextTrack()" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>

            <!-- STREAMING PLAYLIST SELECTION PORTAL -->
            <div class="bg-slate-950/80 border border-slate-800 p-4 rounded-xl flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h4 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">Global HQ Audio Queue</h4>
                    <span class="text-xs bg-indigo-900/60 text-indigo-300 font-medium px-2 py-0.5 rounded-full border border-indigo-700/30">Hi-Res Active</span>
                </div>
                <div id="playlist-list" class="overflow-y-auto max-h-[180px] flex flex-col gap-1 dynamic-scroll pr-1">
                    <!-- Javascript lists populate here -->
                </div>
            </div>

        </div>
    </div>

    <!-- Hidden Native Audio Node Link element -->
    <audio id="audio-engine" src=""></audio>

    <script>
        // Pre-configured Streaming Audio Array Database (Bypasses Browser CORS Restrictions)
        const musicCatalog = [
            { title: "High-Res Electronic Mix", artist: "Helix Premium Track 01", url: "https://soundhelix.com" },
            { title: "Synthetic Coding Focus", artist: "Helix Premium Track 02", url: "https://soundhelix.com" },
            { title: "Midnight Ambient Chill", artist: "Helix Premium Track 03", url: "https://soundhelix.com" },
            { title: "Deep Focus Studio Beats", artist: "Helix Premium Track 04", url: "https://soundhelix.com" }
        ];

        let currentTrackIdx = 0;
        let isSeeking = false;
        const audio = document.getElementById('audio-engine');
        const playBtn = document.getElementById('play-btn');
        const progressBar = document.getElementById('progress-bar');

        // Automatically fire the initialization sequence when the screen loads
        window.onload = function() {
            initPlayer();
        };

        function initPlayer() {
            const listContainer = document.getElementById('playlist-list');
            listContainer.innerHTML = "";
            
            musicCatalog.forEach((track, index) => {
                const trackRow = document.createElement('div');
                trackRow.className = `flex items-center justify-between p-3 rounded-lg cursor-pointer transition-all border border-transparent hover:bg-slate-900/80 ${index === currentTrackIdx ? 'bg-indigo-950/40 border-indigo-900/60' : ''}`;
                trackRow.setAttribute('onclick', `selectTrack(${index})`);
                trackRow.id = `track-row-${index}`;
                trackRow.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-500 font-mono w-4">${index + 1}</span>
                        <div>
                            <div class="text-sm font-semibold text-slate-200 ${index === currentTrackIdx ? 'text-indigo-400' : ''}">${track.title}</div>
                            <div class="text-xs text-slate-500">${track.artist}</div>
                        </div>
                    </div>
                    <div class="text-xs text-slate-500 uppercase font-mono tracking-widest bg-slate-900 px-2 py-0.5 rounded border border-slate-800">HQ</div>
                `;
                listContainer.appendChild(trackRow);
            });
            loadTrack(currentTrackIdx);
        }

        function loadTrack(idx) {
            currentTrackIdx = idx;
            const track = musicCatalog[idx];
            audio.src = track.url;
            document.getElementById('player-title').innerText = track.title;
            document.getElementById('player-album').innerText = track.artist;
            
            musicCatalog.forEach((_, i) => {
                const row = document.getElementById(`track-row-${i}`);
                if(row) {
                    if(i === idx) {
                        row.className = "flex items-center justify-between p-3 rounded-lg cursor-pointer transition-all border border-indigo-900/60 bg-indigo-950/40";
                    } else {
                        row.className = "flex items-center justify-between p-3 rounded-lg cursor-pointer transition-all border border-transparent hover:bg-slate-900/80";
                    }
                }
            });
        }
